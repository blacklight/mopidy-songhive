[songhive]
enabled = true
# Base URL of the Songhive instance, e.g. https://music.example.com
hostname =
# API token created under Settings -> API tokens. Leave empty for
# anonymous access: only public content is visible and no changes
# (playlists, favorites) can be made.
api_token =
# Comma-separated allowlist of library names to show. Empty = all.
libraries =
# Format for displaying album names. Available keys: title, release_year
# (default: {title})
album_format =
# Optional on-the-fly transcoding requested from the server when
# streaming: one of mp3, ogg, flac, aac, opus.
transcode_format =
# Optional bitrate in kbps for transcoded streams.
transcode_bitrate =
